<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retold — The Odyssey</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sea:#060f18;--sea-deep:#0a1c2b;--sea-mid:#0f2a3d;
  --bronze:#c99a4b;--bronze-bright:#e6c073;
  --bone:#ede3cf;--bone-dim:#b6ab97;--ash:#6f7c83;
  --clay:#c26a3d;--clay-lo:#7c3820;--figure:#100a10;--incise:#e0965f;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--sea)}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.layer{position:absolute;inset:0;z-index:1}
.beat{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  opacity:0;padding:0 8%;text-align:center;pointer-events:none;
}

/* Beat 1: "2,800 years old." — visible 0.5s–4.2s */
.beat-1{animation: appear 0.8s ease 0.5s forwards, disappear 0.8s ease 3.4s forwards}
.beat-1 .line{
  font:300 clamp(28px,7vw,48px)/1.3 var(--serif);
  color:var(--bone-dim);letter-spacing:0.02em;
}
.beat-1 .num{color:var(--bone);font-weight:400}

/* Beat 2: "Never looked like this." — visible 3.8s–7.5s */
.beat-2{animation: appear 0.8s ease 3.8s forwards, disappear 0.8s ease 6.7s forwards}
.beat-2 .line{
  font:italic 300 clamp(30px,7.5vw,54px)/1.2 var(--serif);
  color:var(--bone);letter-spacing:0.01em;
}

/* Beat 3: Tondos — visible 7s–14.5s */
.beat-3{animation: appear 0.8s ease 7s forwards, disappear 0.8s ease 13.7s forwards}
.tondo-row{
  display:flex;flex-direction:column;align-items:center;gap:clamp(20px,4vh,36px);
}
.tondo-frame{
  width:clamp(110px,30vw,170px);height:auto;
  opacity:0;transform:scale(0.7) translateY(12px);
}
.tondo-frame:nth-child(1){animation:pushIn 1s cubic-bezier(.23,1,.32,1) 7.4s forwards}
.tondo-frame:nth-child(2){animation:pushIn 1s cubic-bezier(.23,1,.32,1) 8.6s forwards}
.tondo-frame:nth-child(3){animation:pushIn 1s cubic-bezier(.23,1,.32,1) 9.8s forwards}
.tondo-label{
  font:italic 300 clamp(12px,2.8vw,16px)/1.4 var(--serif);
  color:var(--bronze);opacity:0;margin-top:6px;text-align:center;
}
.tondo-frame:nth-child(1) .tondo-label{animation:appear 0.6s ease 8s forwards}
.tondo-frame:nth-child(2) .tondo-label{animation:appear 0.6s ease 9.2s forwards}
.tondo-frame:nth-child(3) .tondo-label{animation:appear 0.6s ease 10.4s forwards}

/* Beat 4: Brand — appears 14s, STAYS VISIBLE */
.beat-4{animation: appear 1.2s ease 14s forwards}
.brand-eyebrow{
  font:300 clamp(11px,2.5vw,14px)/1 var(--serif);
  color:var(--bronze);letter-spacing:0.3em;text-transform:uppercase;
  opacity:0;animation:appear 0.8s ease 14.4s forwards;
}
.brand-title{
  font:300 clamp(42px,13vw,76px)/1 var(--serif);
  color:var(--bone);letter-spacing:0.15em;
  margin-top:clamp(10px,2.5vh,18px);
  opacity:0;animation:appear 1s ease 14.8s forwards;
}
.brand-sub{
  font:italic 300 clamp(15px,3.8vw,24px)/1.4 var(--serif);
  color:var(--bone-dim);
  margin-top:clamp(14px,3.5vh,28px);
  opacity:0;animation:appear 0.8s ease 15.6s forwards;
}
.brand-rule{
  width:60px;height:1px;background:var(--bronze);
  margin-top:clamp(20px,5vh,36px);
  opacity:0;animation:appear 0.8s ease 15.2s forwards;
}
.brand-tagline{
  font:300 clamp(12px,2.8vw,16px)/1.5 var(--serif);
  color:var(--ash);
  margin-top:clamp(14px,3.5vh,24px);
  opacity:0;animation:appear 1s ease 16.4s forwards;
}

/* Replay hint — appears after everything */
.replay{
  position:fixed;bottom:clamp(20px,4vh,40px);left:50%;transform:translateX(-50%);
  font:300 clamp(10px,2.2vw,13px)/1 var(--serif);color:var(--ash);
  letter-spacing:0.1em;opacity:0;z-index:2;cursor:pointer;
  animation:appear 1s ease 18s forwards;
  background:none;border:1px solid rgba(111,124,131,.3);
  padding:8px 16px;border-radius:20px;pointer-events:auto;
}
.replay:hover{color:var(--bronze);border-color:var(--bronze)}

@keyframes appear{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes disappear{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-8px)}
}
@keyframes pushIn{
  from{opacity:0;transform:scale(0.7) translateY(12px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}

.glow{
  position:absolute;width:200%;height:200%;top:-50%;left:-50%;
  background:radial-gradient(circle,rgba(201,154,75,0.06) 0%,transparent 55%);
  pointer-events:none;
}
</style>

<div class="trailer" style="width:100%;height:100%;position:relative;overflow:hidden">
  <canvas id="stars"></canvas>
  <div class="layer">

    <!-- BEAT 1 -->
    <div class="beat beat-1">
      <p class="line"><span class="num">2,800</span> years old.</p>
    </div>

    <!-- BEAT 2 -->
    <div class="beat beat-2">
      <p class="line">Never looked like this.</p>
    </div>

    <!-- BEAT 3: Pottery parade -->
    <div class="beat beat-3">
      <div class="glow"></div>
      <div class="tondo-row">

        <!-- Athena (Book I) -->
        <div class="tondo-frame">
          <svg viewBox="0 0 200 200">
            <defs>
              <clipPath id="cT1"><circle cx="100" cy="100" r="92"/></clipPath>
              <radialGradient id="gT1" cx="50%" cy="34%" r="72%">
                <stop offset="0" stop-color="var(--clay)"/><stop offset="1" stop-color="var(--clay-lo)"/>
              </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="92" fill="url(#gT1)"/>
            <g clip-path="url(#cT1)" fill="var(--figure)">
              <path d="M78,185 C76,150 82,130 100,128 C118,130 124,150 122,185 Z"/>
              <path d="M82,132 L66,155 L72,158 L86,138 Z"/><path d="M118,132 L134,155 L128,158 L114,138 Z"/>
              <circle cx="100" cy="104" r="22"/>
              <path d="M78,104 C78,82 122,82 122,104 L118,104 C118,86 82,86 82,104 Z"/>
              <path d="M92,82 C93,54 107,54 108,82"/><path d="M88,63 C90,56 110,56 112,63 L108,82 L92,82 Z"/>
              <path d="M100,56 C94,48 86,47 82,50 C86,42 96,40 100,46 C104,40 114,42 118,50 C114,47 106,48 100,56 Z"/>
              <rect x="134" y="68" width="3.5" height="100" transform="rotate(5 136 118)"/>
              <path d="M133,68 L136,52 L139,68 Z"/><ellipse cx="70" cy="152" rx="14" ry="18"/>
            </g>
            <g clip-path="url(#cT1)" fill="none">
              <path d="M91,102 q9,-5 18,0" stroke="var(--incise)" stroke-width="1.5" opacity="0.7"/>
              <circle cx="95" cy="101" r="2" fill="#a0b8c8"/><circle cx="105" cy="101" r="2" fill="#a0b8c8"/>
            </g>
            <g clip-path="url(#cT1)" fill="var(--figure)" transform="translate(42,145) scale(0.6)">
              <ellipse cx="30" cy="30" rx="18" ry="16"/>
              <circle cx="23" cy="27" r="6" fill="var(--clay)"/><circle cx="37" cy="27" r="6" fill="var(--clay)"/>
              <circle cx="23" cy="27" r="2.5" fill="var(--figure)"/><circle cx="37" cy="27" r="2.5" fill="var(--figure)"/>
              <path d="M27,34 l3,3 l3,-3" fill="var(--incise)" opacity="0.5"/>
            </g>
            <circle cx="100" cy="100" r="92" fill="none" stroke="var(--bronze)" stroke-width="2.5"/>
            <circle cx="100" cy="100" r="85" fill="none" stroke="var(--bronze)" stroke-width="1" opacity="0.45"/>
          </svg>
          <div class="tondo-label">Athena</div>
        </div>

        <!-- Hermes over the sea (Book V) -->
        <div class="tondo-frame">
          <svg viewBox="0 0 200 200">
            <defs>
              <clipPath id="cT2"><circle cx="100" cy="100" r="92"/></clipPath>
              <radialGradient id="gT2" cx="50%" cy="34%" r="72%">
                <stop offset="0" stop-color="var(--clay)"/><stop offset="1" stop-color="var(--clay-lo)"/>
              </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="92" fill="url(#gT2)"/>
            <g clip-path="url(#cT2)" fill="var(--figure)">
              <rect x="8" y="8" width="184" height="80" opacity="0.1"/>
              <path d="M8,130 q18,-8 36,0 t36,0 t36,0 t36,0 t36,0 v70 h-200 z" opacity="0.85"/>
              <path d="M8,142 q18,-6 36,0 t36,0 t36,0 t36,0 t36,0 v60 h-200 z"/>
              <circle cx="100" cy="68" r="10"/><path d="M90,78 L90,108 L110,108 L110,78 Z"/>
              <path d="M86,104 L74,98 L76,96 L88,100 Z"/><path d="M114,104 L126,98 L124,96 L112,100 Z"/>
              <path d="M90,62 L82,54 L86,54 L92,60 Z"/><path d="M110,62 L118,54 L114,54 L108,60 Z"/>
              <rect x="108" y="72" width="3" height="30" fill="var(--incise)" opacity="0.6"/>
              <path d="M108,74 q-6,-6 0,-12 q6,6 0,12" fill="none" stroke="var(--incise)" stroke-width="1" opacity="0.5"/>
              <path d="M111,74 q6,-6 0,-12 q-6,6 0,12" fill="none" stroke="var(--incise)" stroke-width="1" opacity="0.5"/>
            </g>
            <g clip-path="url(#cT2)" stroke="var(--incise)" stroke-width="1" fill="none" opacity="0.4">
              <path d="M20,136 q14,-4 28,0 t28,0 t28,0"/>
            </g>
            <circle cx="100" cy="100" r="92" fill="none" stroke="var(--bronze)" stroke-width="2.5"/>
            <circle cx="100" cy="100" r="85" fill="none" stroke="var(--bronze)" stroke-width="1" opacity="0.45"/>
          </svg>
          <div class="tondo-label">Hermes</div>
        </div>

        <!-- Odysseus in the mist (Book VII) -->
        <div class="tondo-frame">
          <svg viewBox="0 0 200 200">
            <defs>
              <clipPath id="cT3"><circle cx="100" cy="100" r="92"/></clipPath>
              <radialGradient id="gT3" cx="50%" cy="34%" r="72%">
                <stop offset="0" stop-color="var(--clay)"/><stop offset="1" stop-color="var(--clay-lo)"/>
              </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="92" fill="url(#gT3)"/>
            <g clip-path="url(#cT3)" fill="var(--figure)">
              <rect x="10" y="46" width="34" height="146" opacity="0.5"/>
              <rect x="16" y="36" width="10" height="12" opacity="0.4"/>
              <rect x="34" y="30" width="10" height="18" opacity="0.4"/>
              <rect x="156" y="50" width="34" height="142" opacity="0.5"/>
              <rect x="160" y="38" width="10" height="14" opacity="0.4"/>
              <rect x="178" y="32" width="10" height="20" opacity="0.4"/>
              <rect x="8" y="164" width="184" height="28" opacity="0.35"/>
              <circle cx="112" cy="106" r="9"/>
              <path d="M100,114 Q112,108 124,114 L128,166 L96,166 Z"/>
              <circle cx="76" cy="118" r="6"/><path d="M69,124 L69,164 L83,164 L83,124 Z"/>
              <circle cx="66" cy="128" r="4" opacity="0.6"/>
              <path d="M40,90 q20,-6 30,4 q14,-8 26,2 q18,-6 30,4" stroke="var(--incise)" stroke-width="1.4" fill="none" opacity="0.28"/>
              <path d="M30,110 q22,-8 36,2 q16,-10 30,2 q20,-8 34,4" stroke="var(--incise)" stroke-width="1.2" fill="none" opacity="0.22"/>
              <circle cx="112" cy="106" r="24" fill="var(--incise)" opacity="0.05"/>
            </g>
            <circle cx="100" cy="100" r="92" fill="none" stroke="var(--bronze)" stroke-width="2.5"/>
            <circle cx="100" cy="100" r="85" fill="none" stroke="var(--bronze)" stroke-width="1" opacity="0.45"/>
          </svg>
          <div class="tondo-label">Odysseus</div>
        </div>

      </div>
    </div>

    <!-- BEAT 4: Brand (final, stays visible) -->
    <div class="beat beat-4">
      <div class="brand-eyebrow">Retold</div>
      <div class="brand-title">THE ODYSSEY</div>
      <div class="brand-rule"></div>
      <div class="brand-sub">You watched the film. Now live the story.</div>
      <div class="brand-tagline">Read. Play. Experience Homer.</div>
    </div>

  </div>
</div>

<button class="replay" onclick="location.reload()">replay</button>

<script>
// Starfield
(function(){
  var c=document.getElementById('stars'),x=c.getContext('2d');
  var stars=[];
  function resize(){c.width=c.offsetWidth*2;c.height=c.offsetHeight*2;
    stars=[];for(var i=0;i<120;i++)stars.push({
      x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*1.2+0.3,a:Math.random()*0.6+0.2,
      s:Math.random()*0.008+0.003,p:Math.random()*Math.PI*2
    });
  }
  resize();window.addEventListener('resize',resize);
  function draw(t){
    x.clearRect(0,0,c.width,c.height);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var a=s.a*(0.5+0.5*Math.sin(t*s.s+s.p));
      x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);
      x.fillStyle='rgba(237,227,207,'+a+')';x.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

// Generative ambient music — A Aeolian (Book V: Calypso's enchantment)
// Auto-starts on first interaction (browser autoplay policy)
(function(){
  var ctx=null,master=null,playing=false,lyreTimer=null;
  var LYRE=[220,261.63,293.66,329.63,392,440,523.25,659.25];

  function init(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
      ctx=new AC();if(ctx.state==="suspended")ctx.resume();
      master=ctx.createGain();master.gain.value=0.0001;
      master.connect(ctx.destination);

      var d1=ctx.createOscillator();d1.type="sine";d1.frequency.value=110;
      var g1=ctx.createGain();g1.gain.value=0.065;
      var lfo1=ctx.createOscillator();lfo1.type="sine";lfo1.frequency.value=0.06;
      var lg1=ctx.createGain();lg1.gain.value=0.012;
      lfo1.connect(lg1);lg1.connect(g1.gain);
      d1.connect(g1);g1.connect(master);d1.start();lfo1.start();

      var d2=ctx.createOscillator();d2.type="sine";d2.frequency.value=164.81;d2.detune.value=-6;
      var g2=ctx.createGain();g2.gain.value=0.04;
      d2.connect(g2);g2.connect(master);d2.start();

      var d3=ctx.createOscillator();d3.type="sine";d3.frequency.value=220;
      var g3=ctx.createGain();g3.gain.value=0.02;
      var lfo2=ctx.createOscillator();lfo2.type="sine";lfo2.frequency.value=0.09;
      var lg2=ctx.createGain();lg2.gain.value=0.006;
      lfo2.connect(lg2);lg2.connect(g3.gain);
      d3.connect(g3);g3.connect(master);d3.start();lfo2.start();

      var pad=ctx.createOscillator();pad.type="sawtooth";pad.frequency.value=220;
      var lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=520;lp.Q.value=0.5;
      var gp=ctx.createGain();gp.gain.value=0.012;
      var lfo4=ctx.createOscillator();lfo4.type="sine";lfo4.frequency.value=0.07;
      var lg4=ctx.createGain();lg4.gain.value=80;
      lfo4.connect(lg4);lg4.connect(lp.frequency);
      pad.connect(lp);lp.connect(gp);gp.connect(master);pad.start();lfo4.start();

      var len=ctx.sampleRate*4,buf=ctx.createBuffer(1,len,ctx.sampleRate),dd=buf.getChannelData(0);
      for(var i=0;i<len;i++)dd[i]=Math.random()*2-1;
      var ns=ctx.createBufferSource();ns.buffer=buf;ns.loop=true;
      var bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=380;bp.Q.value=0.6;
      var lfo3=ctx.createOscillator();lfo3.type="sine";lfo3.frequency.value=0.04;
      var lg3=ctx.createGain();lg3.gain.value=180;
      lfo3.connect(lg3);lg3.connect(bp.frequency);
      var gn=ctx.createGain();gn.gain.value=0.022;
      ns.connect(bp);bp.connect(gn);gn.connect(master);ns.start();lfo3.start();

      playing=true;
      master.gain.exponentialRampToValueAtTime(0.32,ctx.currentTime+3);
      scheduleLyre();
      return true;
    }catch(e){return false;}
  }

  function lyreNote(){
    if(!playing||!ctx)return;
    var freq=LYRE[Math.floor(Math.random()*LYRE.length)];
    var t=ctx.currentTime,dur=1.2+Math.random()*2.5,peak=0.032+Math.random()*0.025;
    var o=ctx.createOscillator();o.type="triangle";o.frequency.value=freq;
    var g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
    var o2=ctx.createOscillator();o2.type="sine";o2.frequency.value=freq*2;
    var g2=ctx.createGain();
    g2.gain.setValueAtTime(0.0001,t);
    g2.gain.exponentialRampToValueAtTime(peak*0.22,t+0.015);
    g2.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.5);
    o2.connect(g2);g2.connect(master);o2.start(t);o2.stop(t+dur*0.5+0.05);
  }

  function scheduleLyre(){
    if(!playing)return;
    lyreNote();
    lyreTimer=setTimeout(scheduleLyre,1400+Math.random()*2800);
  }

  function autoStart(){
    if(init()){
      document.removeEventListener("pointerdown",autoStart);
      document.removeEventListener("scroll",autoStart);
      document.removeEventListener("keydown",autoStart);
    }
  }
  document.addEventListener("pointerdown",autoStart,{once:false});
  document.addEventListener("scroll",autoStart,{once:false,passive:true});
  document.addEventListener("keydown",autoStart,{once:false});
})();
</script>
</html>
